<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dcterms.title" content="Assistant virtuel SABA"/>
  <meta name="dcterms.language" content="fra"/>
  <meta name="dcterms.creator" content="Emploi et Développement social Canada"/>
  <meta name="dcterms.accessRights" content="3"/>
  <meta name="gcaaterms.sitename" content="ESDC-EDSC_Intranet_SABAVA-SABAAV"/>
  <title>Assistant virtuel SABA</title>
  <link rel="stylesheet" href="style.css">
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <!-- Load qaData.js with timestamp to prevent caching -->
  <script>
    const qaDataScript = document.createElement('script');
    qaDataScript.src = 'qaData.js?t=' + new Date().getTime();
    document.head.appendChild(qaDataScript);
  </script>
  <script src="script.js"></script>
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-N3VGD2R');</script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y071Y25JYB"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-Y071Y25JYB');</script>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N3VGD2R" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <a href="#main-content" class="skip-link">Passer au contenu principal</a>
  <div class="app-container">
    <header class="app-header" role="banner">
      <div class="header-content">
        <div class="logo-title">
          <h1>Assistant virtuel</h1>
        </div>
        <nav class="header-nav" aria-label="Sélection de la langue">
          <div id="language"><a href="assistantEN.html" lang="en" class="lang-switch" data-gc-analytics-customclick="ESDC-EDSC:SABAAI:Toggle-English">English</a></div>
        </nav>
      </div>
    </header>
    <main id="main-content" class="main-content">
      <section class="chat-panel" aria-label="Conversation avec l'assistant virtuel">
        <div id="conversationDiv" class="conversation-area" aria-live="polite" aria-atomic="false">
          <table id="QNA" role="log" aria-label="Messages de clavardage"></table>
          <div id="typingBubble" class="typing-indicator" aria-label="L'assistant écrit">
            <div class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
        </div>
        <div class="messageBar">
          <div class="search-container">
            <label for="textbox" class="visually-hidden">Entrez un mot-clé ou une question</label>
            <div class="input-wrapper">
              <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
              <input type="text" id="textbox" name="msg" autocomplete="off" placeholder="Entrez un mot-clé ou une question..." aria-describedby="search-hint">
              <button type="button" id="clear-search" class="clear-btn" aria-label="Effacer" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <button type="button" id="send" class="send-btn" onclick="sendMessage()"><span>Envoyer</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4 20-7z"></path></svg></button>
          </div>
          <p id="search-hint" class="search-hint">Tapez des mots-clés pour filtrer les questions</p>
          <div id="suggestions-container" class="suggestions-container" role="listbox" aria-label="Suggestions" style="display:none;"></div>
        </div>
      </section>
      <aside class="sidebar" aria-label="Panneau des questions suggérées">
        <div class="sidebar-header">
          <h2>Questions suggérées</h2>
          <button type="button" id="clear-chat-btn" class="clear-chat-btn" onclick="clearChat()">Effacer le chat</button>
        </div>
        <div class="sidebar-content">
          <div id="built-in-questions" class="quick-actions">
            <button id="allQuestions" class="action-btn action-btn-primary" onclick="listAllQuestions(); pushbeacon(event, 'List all questions')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg><span>Afficher toutes les questions</span></button>
            <button id="initialQuestions" class="action-btn action-btn-secondary hidden" onclick="listInitialQuestions(); pushbeacon(event, 'List initial questions')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Afficher les options initiales</span></button>
          </div>
          <div id="questions" class="questions-list" role="list"></div>
        </div>
      </aside>
    </main>
    <div id="answers" class="hidden" aria-hidden="true"></div>
  </div>
  <script>
    var textbox = document.getElementById("textbox");
    var clearBtn = document.getElementById("clear-search");
    var suggestionsContainer = document.getElementById("suggestions-container");
    textbox.addEventListener("keyup", function(event) {
      event.preventDefault();
      if (event.keyCode === 13) { document.getElementById("send").click(); hideSuggestions(); }
      else { showSuggestions(this.value); }
      toggleClearButton();
    });
    textbox.addEventListener("input", function() { toggleClearButton(); showSuggestions(this.value); });
    textbox.addEventListener("focus", function() { if (this.value.length > 0) showSuggestions(this.value); });
    clearBtn.addEventListener("click", function() { textbox.value = ""; toggleClearButton(); hideSuggestions(); textbox.focus(); });
    function toggleClearButton() { clearBtn.style.display = textbox.value.length > 0 ? "flex" : "none"; }
    function showSuggestions(query) {
      if (query.length < 2) { hideSuggestions(); return; }
      var keywords = ["mot de passe", "réinitialiser", "connexion", "compte", "certificat", "formation", "cours", "inscription", "gestionnaire", "apprenant", "administrateur", "relevé", "achèvement", "accès", "profil", "instructeur", "classe", "horaire", "notification", "courriel", "rapport", "tableau de bord", "paramètres"];
      var matches = keywords.filter(function(kw) { return kw.toLowerCase().indexOf(query.toLowerCase()) !== -1; }).slice(0, 6);
      if (matches.length > 0) {
        suggestionsContainer.innerHTML = matches.map(function(match) {
          return '<button type="button" class="suggestion-item" role="option" onclick="selectSuggestion(\'' + match.replace(/'/g, "\\'") + '\')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg><span>' + match + '</span></button>';
        }).join('');
        suggestionsContainer.style.display = "block";
      } else { hideSuggestions(); }
    }
    function hideSuggestions() { suggestionsContainer.style.display = "none"; }
    function selectSuggestion(value) { textbox.value = value; hideSuggestions(); document.getElementById("send").click(); }
    document.addEventListener("click", function(e) { if (!textbox.contains(e.target) && !suggestionsContainer.contains(e.target)) hideSuggestions(); });

    // Q&A data is loaded synchronously from qaData.js, so we can initialize right away
    window.onload = () => {
      init();
    }
  </script>
  <script type="text/javascript">if(typeof _satellite !== 'undefined') { _satellite.pageBottom(); }</script>
</body>
</html>
